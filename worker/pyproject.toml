[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbonflow-worker"
version = "0.1.0"
description = "CarbonFlow Preflight processing worker: ingestion and document parsing"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",
  "openpyxl>=3.1",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["carbonflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
